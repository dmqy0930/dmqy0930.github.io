<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物大模型学习监督面板 | 15周计划</title>
<style>
  :root {
    /* === 浅色模式 (Fluid 日间) === */
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #d0d5dd;
    --text: #1e293b;
    --text-secondary: #64748b;
    --accent: #38bdf8;              /* 保留原始深蓝强调 */
    --accent-dim: #e0f2fe;          /* 浅蓝背景 */
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --purple: #8b5cf6;
    --code-bg: #f1f5f9;
    --code-text: #1e293b;
    --formula-text: #0c4a6e;
    --sidebar-header-bg: linear-gradient(135deg, #0c4a6e 0%, #0369a1 100%);
    --sidebar-header-text: #e0f2fe;
    --sidebar-header-sub: #7dd3fc;
    --tag-bg: #f1f5f9;
  }

  /* === 深色 (prefers-color-scheme / Fluid 暗色) === */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0c4a6e;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --purple: #a78bfa;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --formula-text: var(--accent);
      --sidebar-header-bg: linear-gradient(135deg, #0c4a6e 0%, #1e293b 100%);
      --sidebar-header-text: #e2e8f0;
      --sidebar-header-sub: #94a3b8;
      --tag-bg: #0f172a;
    }
  }

  /* Fluid 手动切换暗色 → data-theme 属性 */
  html[data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --text-secondary: #94a3b8;
    --accent: #38bdf8;
    --accent-dim: #0c4a6e;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --purple: #a78bfa;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --formula-text: var(--accent);
    --sidebar-header-bg: linear-gradient(135deg, #0c4a6e 0%, #1e293b 100%);
    --sidebar-header-text: #e2e8f0;
    --sidebar-header-sub: #94a3b8;
    --tag-bg: #0f172a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    display: flex; height: 100vh; overflow: hidden;
  }

  /* === SIDEBAR === */
  .sidebar {
    width: 300px; min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar-header-bg);
    flex-shrink: 0;
  }
  .sidebar-header h1 { color: var(--sidebar-header-text); }
  .sidebar-header .sub { color: var(--sidebar-header-sub); }
  .sidebar-header h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
  .sidebar-header .sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }

  .sidebar-timeline {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 0;
  }
  .sidebar-timeline::-webkit-scrollbar { width: 4px; }
  .sidebar-timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Timeline */
  .tl-phase {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 6px 22px;
    font-size: 0.62rem; font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tl-phase:first-child { padding-top: 8px; }
  .tl-phase .tl-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }

  .tl-node {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 16px 5px 14px; cursor: pointer;
    font-size: 0.72rem; color: var(--text-secondary);
    transition: all 0.15s; position: relative;
  }
  .tl-node:hover { background: rgba(255,255,255,0.03); color: var(--text); }

  /* Timeline vertical line + dot */
  .tl-node .tl-marker {
    display: flex; flex-direction: column; align-items: center;
    width: 16px; flex-shrink: 0; padding-top: 3px;
  }
  .tl-node .tl-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--surface);
    flex-shrink: 0; z-index: 1; transition: all 0.2s;
  }
  .tl-node .tl-line {
    width: 2px; flex: 1; min-height: 100%;
    background: var(--border);
    margin-top: 2px;
  }
  .tl-node:last-child .tl-line { display: none; }

  .tl-node.done .tl-dot {
    background: var(--success); border-color: var(--success);
    box-shadow: 0 0 6px rgba(52,211,153,0.4);
  }
  .tl-node.done .tl-text { color: var(--text-secondary); }
  .tl-node.done .tl-text::after { content: ' ✓'; color: var(--success); font-size: 0.6rem; }

  .tl-node.current .tl-dot {
    background: var(--surface); border-color: var(--accent);
    box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }
  .tl-node.current .tl-text { color: var(--accent); font-weight: 600; }

  .tl-node.active {
    background: var(--accent-dim);
    border-radius: 0 6px 6px 0;
    margin-right: 4px;
  }
  .tl-node.active .tl-dot {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 10px rgba(56,189,248,0.6);
  }
  .tl-node.active .tl-text { color: var(--accent); font-weight: 600; }

  .tl-text { line-height: 1.3; }
  .tl-text .tl-title { display: block; }
  .tl-text .tl-sub { display: block; font-size: 0.6rem; color: var(--text-secondary); font-weight: 400; }

  .sidebar-stats {
    padding: 10px 16px; border-top: 1px solid var(--border);
    font-size: 0.68rem; color: var(--text-secondary);
    flex-shrink: 0;
    display: flex; justify-content: space-between;
  }
  .sidebar-stats span { color: var(--accent); font-weight: 600; }

  /* === MAIN CONTENT === */
  .content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 0; position: relative;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Stats trigger zone — invisible hover area at top */
  .stats-wrapper {
    position: sticky; top: 0; z-index: 20;
  }
  .stats-trigger {
    height: 18px; width: 100%;
    background: var(--accent-dim);
    transition: background 0.2s;
  }
  .stats-trigger:hover {
    background: rgba(56,189,248,0.18);
  }
  .stats-trigger:hover + .stats-bar,
  .stats-bar:hover {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  /* Stats Bar — hidden by default, overlays content below */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    padding: 16px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: absolute; top: 18px; left: 0; right: 0;
    transform: translateY(-100%);
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
  }

  .stat-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; text-align: center;
  }
  .stat-card .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

  /* Content area */
  .content-inner { max-width: 960px; margin: 0 auto; padding: 24px; }

  /* Breadcrumb */
  .breadcrumb {
    font-size: 0.7rem; color: var(--text-secondary);
    margin-bottom: 16px; display: flex; align-items: center; gap: 4px;
  }
  .breadcrumb span { color: var(--accent); }

  /* Week Cards — single week view */
  .week-detail { max-width: 900px; }
  .week-detail .week-card { border-color: var(--accent-dim); }

  /* Week Grid (for all-weeks view fallback) */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .week-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s;
  }
  .week-card:hover { border-color: var(--accent-dim); }
  .week-card.completed { border-color: var(--success); opacity: 0.85; }
  .week-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }

  .week-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .week-num {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .week-title { font-size: 1.1rem; font-weight: 600; margin-top: 2px; }
  .week-status {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .week-status.done { background: var(--success); border-color: var(--success); color: #000; }

  /* Sections inside card */
  .card-section { margin-bottom: 12px; }
  .card-section h4 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-section h4 .icon { font-size: 0.85rem; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .tag.math { color: var(--purple); border-color: var(--purple); background: rgba(111,66,193,0.08); }
  .tag.exp { color: #b8860b; border-color: var(--warning); background: rgba(255,193,7,0.1); }
  .tag.risk { color: var(--danger); border-color: var(--danger); background: rgba(220,53,69,0.06); }

  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.7rem;
    overflow-x: auto;
    white-space: pre;
    color: var(--code-text);
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.4;
  }
  .formula {
    background: var(--accent-dim);
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.8rem;
    text-align: center;
    color: var(--formula-text);
    overflow-x: auto;
  }

  /* Checklist */
  .checklist { list-style: none; }
  .checklist li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 4px 0;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 4px;
    padding: 4px 6px;
    transition: background 0.15s;
  }
  .checklist li:hover { background: rgba(255,255,255,0.03); }
  .check-box {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-size: 0.6rem;
    color: transparent;
  }
  .check-box.checked {
    background: var(--success);
    border-color: var(--success);
    color: #000;
  }
  .check-text.done { text-decoration: line-through; color: var(--text-secondary); }

  /* Paper link */
  .paper-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent); text-decoration: none;
    font-size: 0.75rem; font-weight: 500;
  }
  .paper-link:hover { text-decoration: underline; }

  /* Daily Tasks */
  .daily-toggle {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    width: 100%;
    text-align: left;
    transition: all 0.15s;
    margin-bottom: 8px;
  }
  .daily-toggle:hover { background: rgba(56,189,248,0.15); }
  .daily-toggle .arrow { transition: transform 0.2s; font-size: 0.6rem; }
  .daily-toggle.open .arrow { transform: rotate(90deg); }

  .daily-container { display: none; margin-bottom: 12px; }
  .daily-container.open { display: block; }

  .day-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 6px;
    transition: border-color 0.15s;
  }
  .day-card:hover { border-color: var(--accent-dim); }
  .day-card .day-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .day-card .day-num {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .day-card .day-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
  }
  .day-card .day-section {
    margin-bottom: 6px;
    font-size: 0.72rem;
  }
  .day-card .day-section .day-label {
    color: var(--accent);
    font-weight: 600;
    margin-right: 4px;
    font-size: 0.68rem;
    text-transform: uppercase;
  }
  .day-card .day-section .day-text {
    color: var(--text-secondary);
  }
  .day-card .day-risk {
    font-size: 0.68rem;
    color: var(--danger);
    background: rgba(248,113,113,0.06);
    border-left: 2px solid var(--danger);
    padding: 4px 8px;
    border-radius: 0 3px 3px 0;
    margin-top: 6px;
  }
  .day-checklist { list-style: none; }
  .day-checklist li {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 0.7rem; color: var(--text-secondary);
    padding: 2px 0;
    cursor: pointer;
    border-radius: 3px;
    padding: 2px 4px;
    transition: background 0.15s;
  }
  .day-checklist li:hover { background: rgba(255,255,255,0.03); }
  .day-check-box {
    width: 13px; height: 13px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.5rem;
    color: transparent;
    transition: all 0.15s;
  }
  .day-check-box.checked { background: var(--success); border-color: var(--success); color: #000; }

  /* Track Selector (in sidebar) */
  .track-selector {
    display: flex; gap: 4px; padding: 8px 12px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .track-btn {
    flex: 1; padding: 6px 10px; border-radius: 14px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; font-size: 0.65rem; font-weight: 500;
    transition: all 0.2s; text-align: center; white-space: nowrap;
  }
  .track-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .track-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* Risk callout */
  .risk-callout {
    font-size: 0.72rem;
    color: var(--danger);
    background: rgba(248,113,113,0.06);
    border-left: 2px solid var(--danger);
    padding: 6px 10px;
    border-radius: 0 4px 4px 0;
    margin-top: 6px;
  }

  /* Reset button */
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--danger); color: var(--danger); }

  .footer {
    text-align: center; padding: 24px;
    color: var(--text-secondary); font-size: 0.7rem;
  }

  /* Homepage */
  .homepage { max-width: 800px; margin: 0 auto; }
  .homepage-hero {
    text-align: center; padding: 40px 24px 32px;
    border-bottom: 1px solid var(--border); margin-bottom: 28px;
  }
  .homepage-hero h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
  .homepage-hero .hero-sub { font-size: 0.85rem; color: var(--text-secondary); }
  .homepage-hero .hero-stats {
    display: flex; justify-content: center; gap: 32px; margin-top: 20px;
  }
  .hero-stat { text-align: center; }
  .hero-stat .hs-val { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .hero-stat .hs-label { font-size: 0.7rem; color: var(--text-secondary); }

  /* Track cards */
  .track-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .track-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; cursor: pointer; transition: all 0.2s;
  }
  .track-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .track-card.active-track { border-color: var(--accent-dim); }
  .track-card .tc-icon { font-size: 1.8rem; margin-bottom: 8px; }
  .track-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .track-card .tc-desc { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
  .track-card .tc-bar {
    height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 6px;
    overflow: hidden;
  }
  .track-card .tc-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
  .track-card .tc-stat { font-size: 0.68rem; color: var(--text-secondary); }

  /* Phase overview */
  .phase-overview { margin-bottom: 28px; }
  .phase-overview h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; }
  .phase-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 6px;
    margin-bottom: 4px; cursor: pointer;
    transition: background 0.15s;
  }
  .phase-row:hover { background: rgba(255,255,255,0.03); }
  .phase-row .pr-label {
    font-size: 0.72rem; font-weight: 500;
    width: 160px; flex-shrink: 0; color: var(--text-secondary);
  }
  .phase-row .pr-bar {
    flex: 1; height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden;
  }
  .phase-row .pr-bar-fill {
    height: 100%; background: var(--success); border-radius: 3px;
    transition: width 0.4s;
  }
  .phase-row .pr-pct {
    font-size: 0.68rem; color: var(--text-secondary);
    width: 36px; text-align: right; flex-shrink: 0;
  }

  /* Quick nav */
  .quick-nav {
    text-align: center; padding: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px;
  }
  .quick-nav p { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; }
  .quick-nav-btn {
    display: inline-block; padding: 8px 20px;
    background: var(--accent); color: #000;
    border-radius: 20px; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; border: none;
    transition: all 0.2s;
  }
  .quick-nav-btn:hover { box-shadow: 0 0 16px rgba(56,189,248,0.3); }

  @media (max-width: 768px) {
    .track-cards { grid-template-columns: 1fr; }
    .homepage-hero .hero-stats { gap: 16px; flex-wrap: wrap; }
    .phase-row .pr-label { width: 100px; font-size: 0.65rem; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { width: 240px; min-width: 240px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 10px 14px; }
    .week-grid { grid-template-columns: 1fr; }
    .content-inner { padding: 16px; }
  }
  @media (max-width: 500px) {
    .sidebar { display: none; }
  }

  /* Math rendering fallback */
  .math { font-family: 'Times New Roman', serif; font-style: italic; }
</style>
</head>
<body>

<!-- === SIDEBAR === -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>生物大模型学习面板</h1>
    <div class="sub" id="sidebarSubtitle">Phase 1 + Phase 2</div>
  </div>

  <div class="track-selector" id="trackSelector">
    <button class="track-btn active" data-track="bio">🧬 生物大模型</button>
    <button class="track-btn" data-track="worldmodel">🌍 世界模型</button>
  </div>

class VAE(torch.nn.Module):
    def __init__(self, input_dim, latent_dim=32):
        super().__init__()
        self.encoder = torch.nn.Sequential(
            torch.nn.Linear(input_dim, 256),
            torch.nn.ReLU(),
            torch.nn.Linear(256, latent_dim * 2)
        )
        self.decoder = torch.nn.Sequential(
            torch.nn.Linear(latent_dim, 256),
            torch.nn.ReLU(),
            torch.nn.Linear(256, input_dim),
            torch.nn.Sigmoid()
        )

    def reparameterize(self, mu, logvar):
        std = torch.exp(0.5 * logvar)
        return mu + torch.randn_like(std) * std

    def forward(self, x):
        h = self.encoder(x)
        mu, logvar = h.chunk(2, dim=-1)
        z = self.reparameterize(mu, logvar)
        return self.decoder(z), mu, logvar

// Helper
function getWeeks() {
  return currentTrack === 'worldmodel'
    ? weeksWorldModelSys
    : weeksBioML;
}

function getStorageKey() {
  return currentTrack === 'worldmodel'
    ? 'wm-sys-learning-progress'
    : 'bio-ml-learning-progress';
}
// ===== STATE =====
let state = loadState()

function loadState() {
  try {
    const saved = localStorage.getItem(getStorageKey());
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  // Default: empty state
  const s = { weekCompleted: {}, checkItems: {}, dayCheckItems: {} };
  getWeeks().forEach(w => {
    s.weekCompleted[w.id] = false;
    s.checkItems[w.id] = {};
    w.criteria.forEach((_, i) => { s.checkItems[w.id][i] = false; });
    // Daily task check state
    if (w.dailyTasks) {
      s.dayCheckItems[w.id] = {};
      w.dailyTasks.forEach((d, di) => {
        s.dayCheckItems[w.id][di] = {};
        d.criteria.forEach((_, ci) => { s.dayCheckItems[w.id][di][ci] = false; });
      });
    }
  });
  return s;
}

function saveState() {
  localStorage.setItem(getStorageKey(), JSON.stringify(state));
  updateStats();
}

const phaseMetaBio = [
  { phase: 'foundation', label: '基础阶段 · PyTorch → Transformer', range: '第2-4周' },
  { phase: 'bio', label: '生物转向 · 序列建模 → 结构预测', range: '第5-7周' },
  { phase: 'advanced', label: '进阶训练 · 微调 → 分布式优化', range: '第8-11周' },
  { phase: 'project', label: '项目产出 · 完整可复现项目', range: '第12周' },
  { phase: 'worldmodel', label: '世界模型 · 原理 → 生物模拟', range: '第13-15周' }
];
const phaseMetaWM = [
  { phase: 'math', label: '数学基础 · ELBO / SSM / RNN', range: '第1-2周' },
  { phase: 'vae', label: 'VAE + Transformer 动力学建模', range: '第3-4周' },

  { phase: 'bio', label: '生物应用 · Protein / Cell WM', range: '第8-10周' },
  { phase: 'project', label: '项目产出 · 三选一 WM 项目', range: '第12周' }
];

function buildTimeline() {
  const container = document.getElementById('sidebarTimeline');
  const phaseMeta = currentTrack === 'worldmodel' ? phaseMetaWM : phaseMetaBio;
  const weeks = getWeeks();
  // Current week = first incomplete
  const currentWeekId = weeks.find(w => !state.weekCompleted[w.id])?.id || null;
  let html = '';

  phaseMeta.forEach(pm => {
    const phaseWeeks = weeks.filter(w => w.phase === pm.phase);
    if (phaseWeeks.length === 0) return;
    const allPhaseDone = phaseWeeks.every(w => state.weekCompleted[w.id]);

    // Phase header
    html += `<div class="tl-phase">`;
    html += `<span class="tl-dot" style="${allPhaseDone ? 'background:var(--success);border-color:var(--success);' : ''}"></span>`;
    html += `${pm.label}`;
    html += allPhaseDone ? ' ✓' : '';
    html += `</div>`;

    // Week nodes
    phaseWeeks.forEach((w, idx) => {
      const done = state.weekCompleted[w.id];
      const isActive = w.id === selectedWeekId;
      const isCurrent = !done && w.id === currentWeekId && !isActive;

      let cls = 'tl-node';
      if (done) cls += ' done';
      if (isActive) cls += ' active';
      else if (isCurrent) cls += ' current';

      html += `<div class="${cls}" data-week-id="${w.id}" onclick="selectWeek(${w.id})">`;
      html += `<div class="tl-marker">`;
      html += `<span class="tl-dot"></span>`;
      if (idx < phaseWeeks.length - 1 || pm !== phaseMeta[phaseMeta.length - 1]) {
        html += `<span class="tl-line"></span>`;
      }
      html += `</div>`;
      html += `<div class="tl-text">`;
      html += `<span class="tl-title">第${w.id}周 · ${w.title}</span>`;
      html += `<span class="tl-sub">${w.subtitle}</span>`;
      html += `</div></div>`;
    });
  });

  container.innerHTML = html;

  // Scroll to active/current node
  setTimeout(() => {
    const activeEl = container.querySelector('.tl-node.active') || container.querySelector('.tl-node.current');
    if (activeEl) {
      activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }, 100);
}

function switchTrack(track) {
  currentTrack = track;
  state = loadState();
  document.getElementById('sidebarSubtitle').textContent = track === 'worldmodel' ? '世界模型系统学习 · 12周' : '生物大模型 · 第2-15周';
  document.querySelectorAll('.track-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.track === track);
  });
  selectedWeekId = null;
  buildTimeline();
  renderHomepage();
  updateStats();
}

function selectFirstIncomplete(phase) {
  const weeks = getWeeks();
  const first = weeks.find(w => w.phase === phase && !state.weekCompleted[w.id]);
  if (first) selectWeek(first.id);
  else {
    const any = weeks.find(w => w.phase === phase);
    if (any) selectWeek(any.id);
  }
}

// ===== WEEK SELECTION =====
function selectWeek(weekId) {
  selectedWeekId = weekId;
  const w = getWeeks().find(x => x.id === weekId);
  if (!w) return;

  // Update sidebar
  buildTimeline();

  // Render week detail in content area
  const inner = document.getElementById('contentInner');
  const phaseMeta = currentTrack === 'worldmodel' ? phaseMetaWM : phaseMetaBio;
  const pm = phaseMeta.find(p => p.phase === w.phase);
  const trackLabel = currentTrack === 'worldmodel' ? '世界模型系统学习' : '生物大模型';

  inner.innerHTML = `
    <div class="breadcrumb">
      ${trackLabel} / ${pm ? pm.label : w.phase} / <span>第${w.id}周 ${w.title}</span>
      <button class="reset-btn" style="margin-left:auto;font-size:0.65rem;padding:3px 10px;" onclick="resetAll()">重置进度</button>
    </div>
    <div class="week-detail"></div>
  `;
  const detail = inner.querySelector('.week-detail');
  const card = createWeekCard(w, true);
  detail.appendChild(card);

  updateStats();
}

// ===== RENDER =====
function renderWeekDetail(w) {
  const inner = document.getElementById('contentInner');
  inner.innerHTML = '';
  const card = createWeekCard(w, true);
  inner.appendChild(card);
}

function createWeekCard(w, isDetail = false) {
  const card = document.createElement('div');
  card.className = 'week-card';
  if (state.weekCompleted[w.id]) card.classList.add('completed');

  // Determine if this is the current week
  const allIds = getWeeks().map(x => x.id);
  const firstIncomplete = allIds.find(id => !state.weekCompleted[id]);
  if (w.id === firstIncomplete) card.classList.add('current');

  let html = '';

  // Header
  html += `<div class="week-header">`;
  html += `<div><div class="week-num">第 ${w.id} 周</div><div class="week-title">${w.title}</div><div style="font-size:0.8rem;color:var(--text-secondary);">${w.subtitle}</div></div>`;
  html += `<div class="week-status${state.weekCompleted[w.id] ? ' done' : ''}" onclick="toggleWeek(${w.id})" title="标记整周完成">${state.weekCompleted[w.id] ? '✓' : ''}</div>`;
  html += `</div>`;

  // Key Points
  html += `<div class="card-section"><h4><span class="icon">📌</span> 学习要点</h4><div class="tag-list">`;
  w.points.forEach(p => {
    const tagClass = p.includes('公式') || p.includes('math') ? 'tag math' : 'tag';
    html += `<span class="${tagClass}">${p}</span>`;
  });
  html += `</div></div>`;

  // Formulas
  if (w.formulas.length > 0) {
    html += `<div class="card-section"><h4><span class="icon">📐</span> 核心公式</h4>`;
    w.formulas.forEach(f => {
      html += `<div class="formula">${f}</div>`;
    });
    html += `</div>`;
  }

  // Experiment
  if (w.experiment) {
    html += `<div class="card-section"><h4><span class="icon">🔬</span> 必做实验</h4>`;
    html += `<div class="code-block">${escapeHTML(w.experiment)}</div>`;
    html += `</div>`;
  }

  // Paper
  if (w.paper) {
    html += `<div class="card-section"><h4><span class="icon">📄</span> 必读论文</h4>`;
    if (w.paperUrl) {
      html += `<a href="${w.paperUrl}" target="_blank" rel="noopener" class="paper-link">↗ ${w.paper}</a>`;
    } else {
      html += `<span style="font-size:0.8rem;">${w.paper}</span>`;
    }
    html += `</div>`;
  }

  // Resources
  if (w.resources && w.resources.length > 0) {
    html += `<div class="card-section"><h4><span class="icon">🔗</span> 学习资源</h4>`;
    html += `<div style="display:flex; flex-direction:column; gap:4px;">`;
    w.resources.forEach(r => {
      html += `<a href="${r.url}" target="_blank" rel="noopener" class="paper-link">↗ ${r.label}</a>`;
      if (r.note) {
        html += `<span style="font-size:0.65rem;color:var(--text-secondary);margin-left:12px;">${r.note}</span>`;
      }
    });
    html += `</div>`;
    if (w.resourceNotes) {
      html += `<div style="font-size:0.68rem;color:var(--warning);margin-top:4px;padding:4px 8px;background:rgba(251,191,36,0.06);border-radius:4px;">💡 ${w.resourceNotes}</div>`;
    }
    html += `</div>`;
  }

  // Daily Tasks (for weeks that have them)
  if (w.dailyTasks && w.dailyTasks.length > 0) {
    const dailyCompleted = w.dailyTasks.every((d, di) =>
      d.criteria.every((_, ci) => state.dayCheckItems[w.id]?.[di]?.[ci])
    );
    html += `<button class="daily-toggle" onclick="event.stopPropagation(); toggleDaily(${w.id})" id="daily-btn-${w.id}">`;
    html += `<span class="arrow">▶</span> 每日任务 (${w.dailyTasks.length}天)`;
    html += dailyCompleted ? ' ✓' : '';
    html += `</button>`;
    html += `<div class="daily-container" id="daily-${w.id}">`;

    w.dailyTasks.forEach((d, di) => {
      const dayDone = d.criteria.every((_, ci) => state.dayCheckItems[w.id]?.[di]?.[ci]);
      html += `<div class="day-card" style="${dayDone ? 'border-color: var(--success); opacity: 0.85;' : ''}">`;
      // Day header
      html += `<div class="day-header">`;
      html += `<span class="day-num">Day ${d.day}</span>`;
      html += `<span class="day-title">${d.title}</span>`;
      html += `</div>`;
      // Learning points
      if (d.points.length > 0) {
        html += `<div class="day-section"><span class="day-label">学习要点</span>`;
        html += `<span class="day-text">${d.points.join(' / ')}</span></div>`;
      }
      // Tasks
      html += `<div class="day-section"><span class="day-label">必须完成</span><ul class="day-checklist">`;
      d.tasks.forEach(t => {
        html += `<li><span style="color:var(--warning);">▸</span> ${t}</li>`;
      });
      html += `</ul></div>`;
      // Criteria checklist
      html += `<div class="day-section"><span class="day-label">验收标准</span><ul class="day-checklist">`;
      d.criteria.forEach((c, ci) => {
        const checked = state.dayCheckItems[w.id]?.[di]?.[ci];
        html += `<li onclick="event.stopPropagation(); toggleDayCheck(${w.id}, ${di}, ${ci})">`;
        html += `<span class="day-check-box${checked ? ' checked' : ''}">${checked ? '✓' : ''}</span>`;
        html += `<span style="${checked ? 'text-decoration:line-through;color:var(--text-secondary);' : ''}">${c}</span>`;
        html += `</li>`;
      });
      html += `</ul></div>`;
      // Risk
      if (d.risks && d.risks.length > 0) {
        d.risks.forEach(r => {
          html += `<div class="day-risk">⚠ ${r}</div>`;
        });
      }
      html += `</div>`;
    });

    html += `</div>`;
  }

  // Acceptance Criteria (checklist)
  html += `<div class="card-section"><h4><span class="icon">✅</span> 验收标准</h4>`;
  if (w.criteriaAnswers && w.criteriaAnswers.length > 0) {
    html += `<button class="daily-toggle" style="margin-bottom:6px;font-size:0.68rem;padding:4px 10px;" onclick="event.stopPropagation(); toggleAnswers(${w.id})" id="ans-btn-${w.id}">`;
    html += `<span class="arrow">▶</span> 查看参考答案</button>`;
    html += `<div id="ans-${w.id}" class="daily-container" style="margin-bottom:6px;">`;
    w.criteriaAnswers.forEach((a, i) => {
      html += `<div style="font-size:0.7rem;color:var(--success);padding:4px 8px;margin:2px 0;background:rgba(52,211,153,0.06);border-radius:4px;">`;
      html += `<span style="color:var(--accent);font-weight:600;">Q${i+1}:</span> ${w.criteria[i]}<br>`;
      html += `<span style="color:var(--success);">✓ ${a}</span></div>`;
    });
    html += `</div>`;
  }
  html += `<ul class="checklist">`;
  w.criteria.forEach((c, i) => {
    const checked = state.checkItems[w.id] && state.checkItems[w.id][i];
    html += `<li onclick="toggleCheck(${w.id}, ${i})">`;
    html += `<span class="check-box${checked ? ' checked' : ''}">${checked ? '✓' : ''}</span>`;
    html += `<span class="check-text${checked ? ' done' : ''}">${c}</span>`;
    html += `</li>`;
  });
  html += `</ul></div>`;

  // Risk
  if (w.risks) {
    w.risks.forEach(r => {
      html += `<div class="risk-callout">⚠ ${r}</div>`;
    });
  }

  card.innerHTML = html;
  return card;
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== ACTIONS =====
function toggleWeek(weekId) {
  state.weekCompleted[weekId] = !state.weekCompleted[weekId];
  // If marking complete, also check all criteria
  if (state.weekCompleted[weekId]) {
    const w = getWeeks().find(x => x.id === weekId);
    if (w) {
      w.criteria.forEach((_, i) => { state.checkItems[weekId][i] = true; });
    }
  }
  saveState();
  if (selectedWeekId === weekId) selectWeek(weekId);
  else { buildTimeline(); updateStats(); }
}

function toggleCheck(weekId, critIdx) {
  if (!state.checkItems[weekId]) state.checkItems[weekId] = {};
  state.checkItems[weekId][critIdx] = !state.checkItems[weekId][critIdx];

  // Auto-complete week if all criteria checked
  const w = getWeeks().find(x => x.id === weekId);
  if (w) {
    const allDone = w.criteria.every((_, i) => state.checkItems[weekId][i]);
    state.weekCompleted[weekId] = allDone;
  }

  saveState();
  if (selectedWeekId === weekId) selectWeek(weekId);
  else { buildTimeline(); updateStats(); }
}

function resetAll() {
  if (confirm('确定要重置全部学习进度吗？此操作不可恢复。')) {
    state = { weekCompleted: {}, checkItems: {}, dayCheckItems: {} };
    getWeeks().forEach(w => {
      state.weekCompleted[w.id] = false;
      state.checkItems[w.id] = {};
      w.criteria.forEach((_, i) => { state.checkItems[w.id][i] = false; });
      if (w.dailyTasks) {
        state.dayCheckItems[w.id] = {};
        w.dailyTasks.forEach((d, di) => {
          state.dayCheckItems[w.id][di] = {};
          d.criteria.forEach((_, ci) => { state.dayCheckItems[w.id][di][ci] = false; });
        });
      }
    });
    saveState();
    selectedWeekId = null;
    buildTimeline();
    renderHomepage();
    updateStats();
  }
}

// ===== STATS =====
function updateStats() {
  const totalWeeks = getWeeks().length;
  const completedWeeks = getWeeks().filter(w => state.weekCompleted[w.id]).length;

  let totalItems = 0, doneItems = 0;
  getWeeks().forEach(w => {
    w.criteria.forEach((_, i) => {
      totalItems++;
      if (state.checkItems[w.id] && state.checkItems[w.id][i]) doneItems++;
    });
  });

  const progressPct = totalWeeks > 0 ? Math.round((completedWeeks / totalWeeks) * 100) : 0;
  const defaultLast = getWeeks()[getWeeks().length - 1]?.id || 1;
  const currentWeek = getWeeks().find(w => !state.weekCompleted[w.id])?.id || defaultLast;
  const currentTitle = getWeeks().find(w => w.id === currentWeek)?.title || '—';

  document.getElementById('stat-progress').textContent = progressPct + '%';
  document.getElementById('stat-completed').textContent = completedWeeks + '/' + totalWeeks;
  document.getElementById('stat-items').textContent = doneItems + '/' + totalItems;
  document.getElementById('stat-current').textContent = '第' + currentWeek + '周';

  // Sidebar stats
  document.getElementById('sidebarCompleted').textContent = completedWeeks + '/' + totalWeeks;
  document.getElementById('sidebarPct').textContent = progressPct + '%';
}

function getCurrentFilter() {
  const active = document.querySelector('.phase-tab.active');
  return active ? active.dataset.filter : 'all';
}

// ===== TRACK SELECTOR =====
document.getElementById('trackSelector').addEventListener('click', (e) => {
  if (e.target.classList.contains('track-btn')) {
    document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentTrack = e.target.dataset.track;
    state = loadState();
    document.getElementById('sidebarSubtitle').textContent = currentTrack === 'worldmodel'
      ? '世界模型系统学习 · 12周'
      : '生物大模型 · 第2-15周';
    selectedWeekId = null;
    buildTimeline();
    renderHomepage();
    updateStats();
  }
});

// Remove deprecated phase tab / filter label functions
function getCurrentFilter() { return 'all'; }
function updateFilterLabel() {}

// ===== DAILY TASKS TOGGLE =====
function toggleDaily(weekId) {
  const container = document.getElementById('daily-' + weekId);
  const btn = document.getElementById('daily-btn-' + weekId);
  if (!container) return;
  const isOpen = container.classList.contains('open');
  if (isOpen) {
    container.classList.remove('open');
    btn.classList.remove('open');
  } else {
    container.classList.add('open');
    btn.classList.add('open');
  }
}

function toggleAnswers(weekId) {
  const container = document.getElementById('ans-' + weekId);
  const btn = document.getElementById('ans-btn-' + weekId);
  if (!container || !btn) return;
  const isOpen = container.classList.contains('open');
  if (isOpen) { container.classList.remove('open'); btn.classList.remove('open'); }
  else { container.classList.add('open'); btn.classList.add('open'); }
}

function toggleDayCheck(weekId, dayIdx, critIdx) {
  if (!state.dayCheckItems[weekId]) state.dayCheckItems[weekId] = {};
  if (!state.dayCheckItems[weekId][dayIdx]) state.dayCheckItems[weekId][dayIdx] = {};
  state.dayCheckItems[weekId][dayIdx][critIdx] = !state.dayCheckItems[weekId][dayIdx][critIdx];
  saveState();
  if (selectedWeekId === weekId) selectWeek(weekId);
  else { buildTimeline(); updateStats(); }
}

// ===== THEME SYNC (Fluid 博客联动) =====
(function() {
  // 方式1: iframe 内接收父页面 Fluid 的主题切换消息
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'fluid-theme') {
      document.documentElement.setAttribute('data-theme', e.data.theme);
    }
  });
  // 方式2: 页面加载时主动尝试读取父页面的主题
  try {
    if (window.parent && window.parent !== window) {
      var parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
      if (parentTheme) {
        document.documentElement.setAttribute('data-theme', parentTheme);
      }
      // 监听父页面主题变化
      var observer = new MutationObserver(function() {
        var t = window.parent.document.documentElement.getAttribute('data-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      });
      observer.observe(window.parent.document.documentElement, {
        attributes: true, attributeFilter: ['data-theme']
      });
    }
  } catch(e) { /* 跨域或非iframe场景，回退到 prefers-color-scheme */ }
})();

// ===== INIT =====
buildTimeline();
renderHomepage();
updateStats();
</script>
